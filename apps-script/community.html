<!doctype html><html lang="zh-Hant"><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:22px;background:#fffaf1;color:#39251d;font:15px/1.7 Arial,"Microsoft JhengHei",sans-serif}button,select,input,textarea{font:inherit}button{cursor:pointer;min-height:44px;border-radius:8px;border:1px solid #d8bda5;padding:9px 18px;background:white;color:#84341e}button[aria-selected=true],button[type=submit]{background:#ba3e25;color:white;border-color:#ba3e25}.tabs{display:flex;gap:10px;margin-bottom:20px}h2{font-size:24px;margin:8px 0}p{margin:8px 0 16px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:24px}form,.feed{padding:22px;border:1px solid #e7d8c8;border-radius:14px;background:#fffdf8;min-width:0}label{display:block;margin:12px 0 6px;font-weight:bold}input,textarea,select{width:100%;padding:10px;border:1px solid #cfb9a5;border-radius:7px;background:white;color:#39251d}textarea{resize:vertical;min-height:130px}.stars{display:flex;gap:8px;flex-wrap:wrap;border:0;padding:0;margin:12px 0}.stars label{margin:0;cursor:pointer;display:flex;align-items:center;gap:3px;color:#9b391d}.stars input{width:auto;accent-color:#ba3e25}.hint{font-size:12px;color:#76604f}article{border-bottom:1px solid #e7d8c8;padding:16px 0}article p{white-space:pre-wrap;overflow-wrap:anywhere}article small{color:#76604f}.status{min-height:26px;color:#8f341e}.hp{position:absolute;left:-10000px}button:disabled{opacity:.5;cursor:wait}[hidden]{display:none!important}:focus-visible{outline:3px solid #ba3e25;outline-offset:3px}@media(max-width:700px){body{padding:12px}.layout{grid-template-columns:1fr}form,.feed{padding:16px}}
</style></head><body><div class="tabs" role="tablist" aria-label="留言與許願"><button id="review-tab" role="tab" aria-selected="true" aria-controls="review-panel">店家留言與評分</button><button id="wish-tab" role="tab" aria-selected="false" aria-controls="wish-panel">特約許願</button></div><p class="hint">暱稱、內容與評分審核後公開。請勿填寫電話、學號或其他個人資料。資料儲存在學生會指定的 Google 試算表。</p>
<section id="review-panel" role="tabpanel"><h2>吃過、去過，分享你的心得</h2><div class="layout"><form id="review-form"><label for="review-store">選擇店家</label><select id="review-store" name="storeId" required></select><label for="review-name">暱稱</label><input id="review-name" name="nickname" maxlength="30" required autocomplete="nickname"><fieldset class="stars"><legend>你的評分</legend><label><input type="radio" name="rating" value="1" required>1 ★</label><label><input type="radio" name="rating" value="2">2 ★</label><label><input type="radio" name="rating" value="3">3 ★</label><label><input type="radio" name="rating" value="4">4 ★</label><label><input type="radio" name="rating" value="5">5 ★</label></fieldset><label for="review-text">用餐或服務心得</label><textarea id="review-text" name="content" maxlength="1000" required placeholder="分享餐點、服務或優惠使用經驗（最多1000字）"></textarea><label class="hp" aria-hidden="true">保留空白<input name="website" tabindex="-1" autocomplete="off"></label><button type="submit">送出留言</button><p class="status" role="status"></p></form><div class="feed"><label for="read-store">查看店家評論</label><select id="read-store"></select><p id="rating-summary"></p><div id="reviews" aria-live="polite">載入中…</div></div></div></section>
<section id="wish-panel" role="tabpanel" hidden><h2>下一間特約，由你提名</h2><div class="layout"><form id="wish-form"><label for="wish-type">選擇許願分類</label><select id="wish-type" name="type" required><option value="">請選擇</option><option>想合作的店家</option><option>想要的優惠</option><option>網站建議</option></select><label for="wish-store">相關店家（選填）</label><select id="wish-store" name="storeId"></select><label for="wish-name">暱稱</label><input id="wish-name" name="nickname" maxlength="30" required><label for="wish-text">你的願望</label><textarea id="wish-text" name="content" maxlength="1000" required placeholder="想合作的店名、地區，或期待的優惠（最多1000字）"></textarea><label class="hp" aria-hidden="true">保留空白<input name="website" tabindex="-1" autocomplete="off"></label><button type="submit">送出願望</button><p class="status" role="status"></p></form><div class="feed"><label for="read-type">查看許願分類</label><select id="read-type"><option value="">全部分類</option><option>想合作的店家</option><option>想要的優惠</option><option>網站建議</option></select><div id="wishes" aria-live="polite">載入中…</div></div></div></section><button id="refresh" type="button">重新載入留言</button><p id="load-status" role="status"></p>
<script>
const stores=__STORES__,q=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data={reviews:[],wishes:[]};const options=stores.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.name)+'</option>').join('');q('#review-store').innerHTML='<option value="">請選擇店家</option>'+options;q('#read-store').innerHTML='<option value="">全部店家</option>'+options;q('#wish-store').innerHTML='<option value="">新店家／不指定（請在內容填寫）</option>'+options;function tab(kind){for(const k of ['review','wish']){q('#'+k+'-panel').hidden=k!==kind;q('#'+k+'-tab').setAttribute('aria-selected',String(k===kind));}}q('#review-tab').onclick=()=>tab('review');q('#wish-tab').onclick=()=>tab('wish');
function render(){const reviews=data.reviews.filter(r=>!q('#read-store').value||r.storeId===q('#read-store').value),wishes=data.wishes.filter(r=>!q('#read-type').value||r.type===q('#read-type').value);q('#rating-summary').textContent=reviews.length?'★ '+(reviews.reduce((n,r)=>n+r.rating,0)/reviews.length).toFixed(1)+' / 5 · '+reviews.length+' 則已審核評論（最近200則範圍）':'尚無已審核評分';function card(r,review){return '<article><strong>'+esc(review?r.storeName:r.type)+'</strong><p>'+esc(r.content)+'</p><small>'+esc(r.nickname)+(review?' · '+r.rating+' ★':'')+' · '+esc(new Date(r.date).toLocaleDateString('zh-TW',{timeZone:'Asia/Taipei'}))+'</small></article>';}q('#reviews').innerHTML=reviews.map(r=>card(r,true)).join('')||'<p>還沒有公開留言，來分享第一則心得吧。</p>';q('#wishes').innerHTML=wishes.map(r=>card(r,false)).join('')||'<p>還沒有公開願望，來提名你期待的特約吧。</p>';}
function refresh(){q('#refresh').disabled=true;q('#load-status').textContent='讀取中…';google.script.run.withSuccessHandler(d=>{data=d;render();q('#refresh').disabled=false;q('#load-status').textContent='已更新';}).withFailureHandler(()=>{q('#refresh').disabled=false;q('#load-status').textContent='暫時無法載入，請稍後重試。';}).getCommunity();}q('#refresh').onclick=refresh;q('#read-store').onchange=render;q('#read-type').onchange=render;
let clientId=crypto.randomUUID();try{clientId=localStorage.getItem('perks-community-client')||clientId;localStorage.setItem('perks-community-client',clientId)}catch{}for(const kind of ['review','wish']){const form=q('#'+kind+'-form');let requestId=crypto.randomUUID();form.addEventListener('input',()=>requestId=crypto.randomUUID());form.onsubmit=e=>{e.preventDefault();if(!form.reportValidity())return;const payload=Object.fromEntries(new FormData(form));Object.assign(payload,{kind,requestId,clientId});const button=form.querySelector('button[type=submit]'),status=form.querySelector('.status');button.disabled=true;status.textContent='送出中…';google.script.run.withSuccessHandler(r=>{status.textContent=r.message;button.disabled=false;form.reset();requestId=crypto.randomUUID();}).withFailureHandler(e=>{status.textContent=e.message||'送出失敗，內容已保留，請重試。';button.disabled=false;}).submitCommunity(payload);};}
window.addEventListener('message',e=>{if(e.origin!=='https://hankhsu33.github.io')return;if(e.data?.type==='select-store'&&stores.some(s=>s.id===e.data.id)){tab('review');q('#review-store').value=e.data.id;q('#read-store').value=e.data.id;render();}});const initialStore=__INITIAL_STORE__;if(stores.some(s=>s.id===initialStore)){q('#review-store').value=initialStore;q('#read-store').value=initialStore;}refresh();
</script></body></html>
